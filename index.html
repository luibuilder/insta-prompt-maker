<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>클로드 프롬프트 5개 자동화 — 수익화 공작소</title>
<style>
  :root{
    --cream:#FBF3E7;
    --paper:#FFFDF9;
    --orange:#E8722C;
    --orange-deep:#C85A1A;
    --dark:#2B2620;
    --line:#EAD9C0;
    --soft:#F4E4CC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--dark);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    padding:32px 16px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin-bottom:36px;}
  header .eyebrow{
    color:var(--orange-deep);font-weight:700;font-size:13px;letter-spacing:.04em;
  }
  header h1{
    font-size:30px;line-height:1.35;margin:10px 0 6px;font-weight:800;
  }
  header h1 span{color:var(--orange);}
  header p{color:#6b5f4f;font-size:14px;margin:0;}

  .step{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:22px 22px 24px;
    margin-bottom:18px;
    position:relative;
    transition:opacity .25s ease;
  }
  .step.locked{opacity:.45;pointer-events:none;}
  .step-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .step-no{
    width:34px;height:34px;border-radius:50%;background:var(--soft);
    color:var(--orange-deep);font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .step-title{font-size:17px;font-weight:800;}
  .step-desc{font-size:13px;color:#7a6c58;margin:6px 0 14px;padding-left:46px;}

  .field{margin-bottom:12px;}
  .field label{
    display:block;font-size:12.5px;font-weight:700;color:var(--orange-deep);
    margin-bottom:6px;
  }
  textarea, input[type=text]{
    width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:14px;font-family:inherit;color:var(--dark);
    background:#fffefb;resize:vertical;
  }
  textarea:focus, input:focus{outline:none;border-color:var(--orange);}

  .btn{
    background:var(--orange);color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{background:var(--orange-deep);}
  .btn:disabled{background:#d9c8b0;cursor:not-allowed;}
  .btn.ghost{
    background:transparent;color:var(--orange-deep);border:1.5px solid var(--orange);
    padding:7px 12px;font-size:12.5px;
  }
  .btn.ghost:hover{background:var(--soft);}

  .output{
    margin-top:14px;border-top:1.5px dashed var(--line);padding-top:14px;
  }
  .output textarea{
    min-height:140px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;
  }
  .output-actions{display:flex;gap:8px;margin-top:8px;}

  .spinner{
    width:14px;height:14px;border:2px solid rgba(255,255,255,.5);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .final{
    text-align:center;margin-top:28px;
  }
  .final .btn{padding:13px 26px;font-size:15px;}

  .hint{font-size:12px;color:#9a8b74;margin-top:6px;}
  .badge{
    display:inline-block;font-size:11px;background:var(--soft);color:var(--orange-deep);
    border-radius:6px;padding:2px 8px;font-weight:700;margin-left:6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">감이 아니라 구조로 만드는 인스타 운영</div>
    <h1>클로드 프롬프트 5개, <span>자동으로 이어서</span> 실행하기</h1>
    <p>주제 선정 → 계정 정체성 → 90일 로드맵 → 릴스 대본 → 도달 전략까지, 한 화면에서 순서대로 실행합니다.</p>
  </header>

  <div id="steps"></div>

  <div class="final">
    <button class="btn" id="downloadAll" disabled>전체 결과 텍스트로 내려받기</button>
    <div class="hint">1단계부터 순서대로 실행해야 다음 단계가 열립니다.</div>
  </div>
</div>

<script>
const STEP_DEFS = [
  {
    title: "인스타그램 주제 찾기",
    desc: "지금 시작해도 기회가 있는 주제 10개를 성장성·난이도·수익화 기준으로 분석합니다.",
    inputs: [
      { key: "hint", label: "관심 분야 / 키워드 (선택)", placeholder: "예: 요리, 재테크, 반려동물, 없으면 비워두세요", type: "input" }
    ],
    build: (v) => `당신은 잘 팔리고 성장 가능성이 높은 인스타그램 세부 주제를 찾아주는 전략가입니다.
지금 시작해도 기회가 있는 인스타그램 주제 10개를 분석해서, 초보자에게 유리한 순서대로 정리해 주세요.
${v.hint ? `\n[참고할 관심 분야]: ${v.hint}\n` : ""}
다음 단계를 따라주세요:
1. 성장성 있고 과포화되지 않은 세부 주제 10개를 찾는다
2. 각 주제별 성장성, 콘텐츠 난이도, 수익화 방식을 정리한다
3. 릴스·카드뉴스·스토리 중 어떤 포맷이 적합한지 추천한다
4. 기회 점수(성장성+난이도+수익화 가능성 종합) 순으로 우선순위를 매긴다

지켜야 할 규칙:
- 너무 포화된 주제는 제외할 것
- 팔로워 수보다 구매력과 지속 가능성을 우선 고려할 것
- 각 주제마다 최소 2가지 수익화 방식을 포함할 것
- 얼굴 노출 없이 운영 가능한지 여부를 표시할 것

결과는 다음 형식의 표로 정리해 주세요:
주제명 | 성장성 | 난이도 | 수익화 방식 | 추천 포맷 | 얼굴 노출 여부 | 기회 점수(우선순위)`
  },
  {
    title: "계정 정체성 만들기",
    desc: "위에서 고른 주제 하나로 계정명·소개·타깃·콘텐츠 기둥을 설계합니다.",
    inputs: [
      { key: "topic", label: "1번 결과 중 선택한 주제", placeholder: "1단계 결과에서 마음에 드는 주제 1개를 붙여넣으세요", type: "textarea", fromPrev: 0 }
    ],
    build: (v) => `당신은 인스타그램 계정의 차별점을 명확하게 잡아주는 브랜드 전략가입니다.
아래 정보를 참고해서 제 계정이 누구를 위한 계정인지, 어떤 내용을 다루는지, 왜 팔로우해야 하는지를 한 번에 정리해 주세요.

[내 주제]: ${v.topic}

다음 단계를 따라주세요:
1. 위 주제를 기반으로 계정의 방향을 확정한다
2. 기억하기 쉬운 계정명(아이디) 후보 5개를 제안한다
3. 한 줄 소개 문구(바이오)를 작성한다
4. 이 계정의 타깃 페르소나를 구체적으로 정리한다(연령, 상황, 고민)
5. 계정을 지탱할 4가지 콘텐츠 기둥(카테고리)을 만든다

지켜야 할 규칙:
- 소개 문구는 한눈에 이해되도록 짧게 쓸 것
- 4가지 콘텐츠 기둥끼리 내용이 겹치지 않게 구성할 것
- 타깃 페르소나는 추상적이지 않고 구체적으로 쓸 것(예: '30대 직장인'이 아니라 상황까지)
- 말투나 톤보다 콘텐츠 포인트(무엇을 줄 것인가)를 더 중요하게 다룰 것

결과는 계정명 후보 / 소개 문구 / 타깃 페르소나 / 콘텐츠 기둥 4가지 / 이 계정만의 차별 포인트 순서로 정리해 주세요.`
  },
  {
    title: "90일 콘텐츠 로드맵",
    desc: "계정 정체성을 바탕으로 12개 콘텐츠 주제와 업로드 일정을 설계합니다.",
    inputs: [
      { key: "identity", label: "2번 결과 (계정 정체성)", placeholder: "2단계 결과를 그대로 붙여넣으세요", type: "textarea", fromPrev: 1 }
    ],
    build: (v) => `당신은 인스타그램 콘텐츠 전략가입니다.
초보자도 실천 가능한 90일 콘텐츠 캘린더를 설계해 주세요. 유입(신규 팔로워 확보)과 전환(구매·행동 유도)이 균형 있게 이뤄지도록 짜주세요.

[계정 정체성 정보]: ${v.identity}

다음 단계를 따라주세요:
1. 위 주제와 콘텐츠 기둥을 확인한다
2. 12개의 구체적인 콘텐츠 주제를 뽑는다(1개월당 4개, 총 3개월)
3. 주 3~4회 업로드 일정을 정한다
4. 각 콘텐츠를 유입형 또는 전환형으로 구분한다
5. 발견→공감→신뢰→관계→권위 순으로 점진적으로 신뢰가 쌓이도록 흐름을 설계한다

지켜야 할 규칙:
- 검색형, 공감형, 사례형 콘텐츠를 균형 있게 배치할 것
- 무리한 업로드 빈도보다 지속 가능한 최소 빈도를 우선할 것
- 비슷한 주제의 반복을 최소화할 것
- 콘텐츠마다 목적(유입/전환)이 명확해야 할 것

결과는 [월차 - 주차 - 콘텐츠 주제 - 포맷 - 유입/전환 구분] 형식의 표로 정리해 주세요.`
  },
  {
    title: "릴스 대본 한 번에 쓰기",
    desc: "로드맵의 콘텐츠 주제 하나를 골라 첫 3초 훅부터 CTA까지 대본을 씁니다.",
    inputs: [
      { key: "reelTopic", label: "대본을 쓸 콘텐츠 주제 1개", placeholder: "3단계 로드맵에서 주제 하나를 골라 붙여넣으세요", type: "textarea" },
      { key: "target", label: "타깃 (2단계 결과에서)", placeholder: "타깃 페르소나를 붙여넣으세요", type: "textarea", fromPrev: 1 }
    ],
    build: (v) => `당신은 스크롤을 멈추게 만드는 인스타그램 릴스 카피라이터입니다.
아래 주제로 첫 3초부터 끝까지 보게 만드는 릴스 대본을 작성해 주세요.

[릴스 주제]: ${v.reelTopic}
[타깃]: ${v.target}

다음 단계를 따라주세요:
1. 주제와 타깃을 확인한다
2. 첫 3초 안에 시선을 붙잡는 훅을 만든다
3. 시청자가 실제로 느끼는 문제를 날카롭게 짚는다
4. 해결 방법을 짧고 구체적으로 설명한다
5. 꼭 기억해야 할 핵심 3가지로 정리한다
6. 행동을 유도하는 CTA를 1개 넣는다

지켜야 할 규칙:
- 첫 3초 안에 궁금증 또는 오픈루프를 만들 것
- 문장은 짧고 말하듯 자연스럽게 쓸 것
- 추상적인 표현보다 바로 써먹을 수 있는 문장을 사용할 것
- CTA는 한 번에 한 가지 행동만 요청할 것

결과는 [훅 → 문제 제기 → 해결 방법 → 핵심 3가지 → CTA → 다음 콘텐츠 예고] 순서의 대본 형식으로 작성해 주세요. 각 구간의 예상 발화 시간(초)도 함께 표시해 주세요.`
  },
  {
    title: "도달률 & 커버 전략",
    desc: "완성된 대본에 커버 문구·캡션·해시태그·A/B 테스트 아이디어를 붙여 발행 직전 상태로 만듭니다.",
    inputs: [
      { key: "script", label: "4번 결과 (릴스 대본 요약)", placeholder: "4단계 대본 결과를 붙여넣으세요", type: "textarea", fromPrev: 3 },
      { key: "target2", label: "타깃", placeholder: "타깃 페르소나", type: "textarea" }
    ],
    build: (v) => `당신은 인스타그램 도달률을 높이는 성장 전략가입니다.
아래 릴스(또는 게시물) 하나에 대해 커버 문구, 캡션, 키워드, 해시태그를 한 번에 설계해 주세요.

[콘텐츠 주제/대본 요약]: ${v.script}
[타깃]: ${v.target2}

다음 단계를 따라주세요:
1. 주제와 타깃을 확인한다
2. 커버 문구 후보 3가지를 만든다
3. 첫 줄부터 훅이 강한 캡션을 작성한다
4. 검색 키워드와 해시태그 10개를 제안한다
5. 저장 또는 공유를 유도하는 CTA를 넣는다
6. A/B 테스트 아이디어를 1가지 제안한다

지켜야 할 규칙:
- 커버 문구는 짧고 한눈에 읽혀야 할 것
- 캡션 첫 2줄 안에 핵심 메시지를 배치할 것
- 해시태그는 대형 키워드+중형 키워드+니치 키워드를 조합할 것
- CTA는 저장/공유/댓글 중 하나에 집중할 것

결과는 [커버 문구 3개 → 캡션 전문 → 해시태그 10개 → A/B 테스트 아이디어] 순서로 정리해 주세요.`
  }
];

const results = new Array(STEP_DEFS.length).fill("");
const stepsEl = document.getElementById("steps");

function render(){
  stepsEl.innerHTML = "";
  STEP_DEFS.forEach((def, i) => {
    const locked = i > 0 && !results[i-1];
    const card = document.createElement("div");
    card.className = "step" + (locked ? " locked" : "");
    card.id = "step-" + i;

    let inputsHTML = "";
    def.inputs.forEach((inp, j) => {
      const prefill = (inp.fromPrev !== undefined && results[inp.fromPrev]) ? results[inp.fromPrev] : "";
      if(inp.type === "textarea"){
        inputsHTML += `<div class="field">
          <label>${inp.label}</label>
          <textarea rows="3" data-step="${i}" data-key="${inp.key}" placeholder="${inp.placeholder}">${escapeHtml(prefill)}</textarea>
        </div>`;
      } else {
        inputsHTML += `<div class="field">
          <label>${inp.label}</label>
          <input type="text" data-step="${i}" data-key="${inp.key}" placeholder="${inp.placeholder}" value="${escapeHtml(prefill)}">
        </div>`;
      }
    });

    card.innerHTML = `
      <div class="step-head">
        <div class="step-no">${i+1}</div>
        <div class="step-title">${def.title}${results[i] ? '<span class="badge">완료</span>' : ''}</div>
      </div>
      <div class="step-desc">${def.desc}</div>
      ${inputsHTML}
      <button class="btn" data-run="${i}">${results[i] ? "다시 실행" : "실행하기"}</button>
      <div class="output" style="${results[i] ? '' : 'display:none'}">
        <textarea data-result="${i}" rows="8">${escapeHtml(results[i])}</textarea>
        <div class="output-actions">
          <button class="btn ghost" data-copy="${i}">복사하기</button>
        </div>
      </div>
    `;
    stepsEl.appendChild(card);
  });

  document.querySelectorAll("[data-run]").forEach(btn=>{
    btn.addEventListener("click", () => runStep(parseInt(btn.dataset.run)));
  });
  document.querySelectorAll("[data-copy]").forEach(btn=>{
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.copy);
      navigator.clipboard.writeText(results[i]);
      btn.textContent = "복사됨!";
      setTimeout(()=> btn.textContent = "복사하기", 1200);
    });
  });

  document.getElementById("downloadAll").disabled = results.every(r => !r);
}

function escapeHtml(s){
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function runStep(i){
  const def = STEP_DEFS[i];
  const card = document.getElementById("step-" + i);
  const btn = card.querySelector("[data-run]");
  const values = {};
  card.querySelectorAll("[data-key]").forEach(el => { values[el.dataset.key] = el.value; });

  const prompt = def.build(values);
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.innerHTML = `<span class="spinner"></span> 생성 중...`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const text = (data.content || [])
      .filter(b => b.type === "text")
      .map(b => b.text)
      .join("\n");
    results[i] = text || "(결과가 비어 있습니다. 다시 시도해 주세요.)";
  }catch(err){
    results[i] = "오류가 발생했습니다: " + err.message;
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
    render();
  }
}

document.getElementById("downloadAll").addEventListener("click", () => {
  const parts = STEP_DEFS.map((def, i) => `=== ${i+1}. ${def.title} ===\n\n${results[i] || "(미실행)"}`);
  const blob = new Blob([parts.join("\n\n\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "인스타그램_5단계_결과.txt";
  a.click();
  URL.revokeObjectURL(url);
});

render();
</script>
</body>
